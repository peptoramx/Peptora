<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peptora — Portal de venta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css?v=2">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/icon-180.png">
<link rel="manifest" href="../site.webmanifest">
<meta name="theme-color" content="#0EA99B">
<style>
  .vend-header{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;box-shadow:var(--shadow-1);}
  .vend-header .n{font-size:16px;font-weight:700;}
  .vend-header .l{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .blocked{background:var(--brick-tint);color:var(--brick);border-radius:var(--radius);padding:16px 20px;font-size:13px;}
  .cart-item{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .cart-item:last-child{border-bottom:none;}
  .cart-item .n{font-weight:600;}
  .cart-item .meta{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .cart-item .rm{background:none;border:none;color:var(--brick);cursor:pointer;font-size:16px;padding:0 4px;}
  .promo-banner{background:var(--teal-tint);color:var(--teal-deep);border-radius:var(--radius-sm);padding:10px 14px;font-size:12.5px;font-weight:600;margin-bottom:12px;display:none;}
  .promo-banner.show{display:block;}
</style>
</head>
<body>
<div class="form-wrap">
  <header>
    <div class="eyebrow">Peptora · portal de vendedor</div>
    <h1>Registrar venta</h1>
    <p>Agrega productos al carrito — descuenta stock al confirmar.</p>
  </header>

  <div id="vendHeader"></div>
  <div class="token-bar" id="tokenBar">
    <input type="password" id="tokenInput" placeholder="Pega tu token de acceso">
    <button onclick="guardarToken()">Guardar</button>
  </div>

  <div id="formArea"></div>
</div>

<script src="../js/datos.js"></script>
<script>
const REPO = 'peptoramx/Peptora';
const API = `https://api.github.com/repos/${REPO}/contents`;
const params = new URLSearchParams(location.search);
const vendedorId = params.get('v');

let vendedor = null, lotes = [], promoConfig = { activo:false, minimo_productos:999, descuento_pct:0 };
let shaCache = {}, tipoVenta = 'vial', carrito = [];

function tokenKey(){ return 'peptora_token_v_' + vendedorId; }
function getToken(){ return localStorage.getItem(tokenKey()); }
function guardarToken(){
  const t = document.getElementById('tokenInput').value.trim();
  if(!t) return;
  localStorage.setItem(tokenKey(), t);
  document.getElementById('tokenBar').classList.remove('show');
  init();
}
function ensureToken(){
  if(!getToken()){ document.getElementById('tokenBar').classList.add('show'); return false; }
  return true;
}
async function ghGetRaw(path){
  const res = await fetch(`${API}/${path}`, { headers:{ 'Authorization':`Bearer ${getToken()}`, 'Accept':'application/vnd.github+json' } });
  if(!res.ok) throw new Error(`GET ${path} -> ${res.status}`);
  const json = await res.json();
  shaCache[path] = json.sha;
  return JSON.parse(decodeURIComponent(escape(atob(json.content))) || '[]');
}
async function ghPut(path, dataArr, msg){
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(dataArr, null, 2))));
  const body = { message: msg, content, branch:'main' };
  if(shaCache[path]) body.sha = shaCache[path];
  const res = await fetch(`${API}/${path}`, {
    method:'PUT',
    headers:{ 'Authorization':`Bearer ${getToken()}`, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error(`PUT ${path} -> ${res.status}: ${await res.text()}`);
  const json = await res.json();
  shaCache[path] = json.content.sha;
}

function bloquear(msg){
  document.getElementById('vendHeader').innerHTML = `<div class="blocked">${msg}</div>`;
  document.getElementById('formArea').innerHTML = '';
  document.getElementById('tokenBar').classList.remove('show');
}

async function init(){
  if(!vendedorId){ bloquear('Link inválido — falta el identificador de vendedor (?v=...).'); return; }
  if(!ensureToken()) return;
  try{
    const vendedores = await ghGetRaw('data/vendedores.json');
    vendedor = vendedores.find(v => v.id === vendedorId);
    if(!vendedor){ bloquear('Vendedor no encontrado.'); return; }
    if(!vendedor.activo){ bloquear(`${vendedor.nombre}: cuenta desactivada. Contacta al administrador.`); return; }
    document.getElementById('vendHeader').innerHTML = `<div class="vend-header"><div class="n">${vendedor.nombre}</div><div class="l">${vendedor.ubicacion||''}</div></div>`;
    lotes = await ghGetRaw('data/lotes.json');
    try{ promoConfig = await ghGetRaw('data/promocion.json'); }catch(e){}
    renderForm();
  }catch(e){ bloquear('Error de acceso — verifica tu token. (' + e.message + ')'); }
}

function renderForm(){
  document.getElementById('formArea').innerHTML = `
    <div class="card">
      <h2>Agregar producto</h2>
      <div class="field" style="margin-bottom:14px;">
        <label>Producto</label>
        <select id="loteSelect"><option value="">— seleccionar —</option></select>
        <div class="stock-info" id="stockInfo"></div>
      </div>
      <div class="row">
        <div class="field">
          <label>Tipo de venta</label>
          <div class="tipo-toggle">
            <button type="button" id="btnCaja" onclick="setTipo('caja')">Por caja</button>
            <button type="button" id="btnVial" class="active" onclick="setTipo('vial')">Por vial</button>
          </div>
        </div>
        <div class="field"><label>Cantidad</label><input id="cantidad" type="number" min="1" value="1"></div>
      </div>
      <div class="check-row"><input type="checkbox" id="precioManualChk" onchange="togglePrecioManual()"><label for="precioManualChk">Cortesía / precio manual</label></div>
      <div class="row" id="precioManualRow" style="display:none;">
        <div class="field"><label>Precio unitario a cobrar</label><input id="precioManual" type="number" step="0.01" placeholder="0 = cortesía"></div>
        <div class="field"><label>Motivo (opcional)</label><input id="motivoManual" placeholder="Cortesía, cliente frecuente…"></div>
      </div>
      <button class="btn ghost" style="width:100%;" onclick="agregarAlCarrito()">+ Agregar al carrito</button>
    </div>
    <div class="card">
      <h2>Carrito</h2>
      <div id="promoBanner" class="promo-banner"></div>
      <div id="carritoLista"><div class="empty">Carrito vacío.</div></div>
      <div class="resumen" id="resumenCarrito" style="display:none;"></div>
    </div>
    <button class="btn" id="submitBtn" onclick="confirmarVenta()" style="width:100%;">Confirmar venta</button>
    <span class="status" id="statusMsg"></span>`;

  const sel = document.getElementById('loteSelect');
  const disponibles = lotes.filter(l => stockEnViales(l) > 0);
  sel.innerHTML = '<option value="">— seleccionar —</option>' +
    disponibles.map(l => `<option value="${l.id}">${l.producto_nombre}${l.concentracion_mg?' '+l.concentracion_mg+'mg':''}</option>`).join('');
  sel.addEventListener('change', onLoteChange);
}

function loteActual(){ return lotes.find(l => l.id === document.getElementById('loteSelect').value); }
function setTipo(t){
  tipoVenta = t;
  document.getElementById('btnCaja').classList.toggle('active', t==='caja');
  document.getElementById('btnVial').classList.toggle('active', t==='vial');
}
function onLoteChange(){
  const l = loteActual();
  const info = document.getElementById('stockInfo');
  if(!l){ info.textContent=''; return; }
  info.textContent = `Disponible: ${stockEnViales(l)} unidades`;
  info.className = 'stock-info' + (stockEnViales(l) < 5 ? ' warn' : '');
  const precioCatalogo = tipoVenta === 'caja' ? l.precio_venta_caja : l.precio_venta_vial;
  document.getElementById('precioManual').value = precioCatalogo;
}
function togglePrecioManual(){
  document.getElementById('precioManualRow').style.display = document.getElementById('precioManualChk').checked ? 'grid' : 'none';
}

function agregarAlCarrito(){
  const l = loteActual();
  if(!l){ setStatus('Selecciona un producto', true); return; }
  const cantidad = parseInt(document.getElementById('cantidad').value) || 0;
  if(cantidad <= 0){ setStatus('Cantidad inválida', true); return; }
  const precioLista = tipoVenta === 'caja' ? l.precio_venta_caja : l.precio_venta_vial;
  const esManual = document.getElementById('precioManualChk').checked;
  const precioUnit = esManual ? (parseFloat(document.getElementById('precioManual').value) || 0) : precioLista;
  const motivo = esManual ? document.getElementById('motivoManual').value.trim() : '';
  carrito.push({ lote_id:l.id, producto_id:l.producto_id, producto_nombre:l.producto_nombre, tipo:tipoVenta, cantidad,
    precioUnit, precioLista, esManual, motivo, subtotal:precioUnit*cantidad, subtotalLista:precioLista*cantidad });
  document.getElementById('cantidad').value = 1;
  document.getElementById('precioManualChk').checked = false;
  togglePrecioManual();
  renderCarrito();
}
function quitarDelCarrito(idx){ carrito.splice(idx,1); renderCarrito(); }

function renderCarrito(){
  const el = document.getElementById('carritoLista');
  const resumenEl = document.getElementById('resumenCarrito');
  const banner = document.getElementById('promoBanner');
  if(!carrito.length){ el.innerHTML = '<div class="empty">Carrito vacío.</div>'; resumenEl.style.display='none'; banner.classList.remove('show'); return; }
  const promo = calcularPromocion(carrito.map(c=>({producto_id:c.producto_id, subtotal:c.subtotal})), promoConfig);
  el.innerHTML = carrito.map((c,i) => `
    <div class="cart-item">
      <div><div class="n">${c.producto_nombre}${c.esManual?` <span class="badge amber" style="font-size:9px;">${c.precioUnit===0?'CORTESÍA':'MANUAL'}</span>`:''}</div><div class="meta">${c.tipo}${c.motivo?' · '+c.motivo:''}</div></div>
      <div class="cell-mono">${c.cantidad} × ${c.esManual && c.precioUnit!==c.precioLista ? `<s style="color:var(--muted);">${formatMoneda(c.precioLista)}</s> ${formatMoneda(c.precioUnit)}` : formatMoneda(c.precioUnit)}</div>
      <div class="cell-mono strong">${formatMoneda(promo.items[i].total_linea)}</div>
      <button class="rm" onclick="quitarDelCarrito(${i})">✕</button>
    </div>`).join('');
  if(promo.aplica){
    banner.classList.add('show');
    banner.textContent = `✓ Promoción: ${promoConfig.minimo_productos}+ productos → ${promoConfig.descuento_pct}% off (${formatMoneda(promo.descuentoTotal)})`;
  } else banner.classList.remove('show');
  resumenEl.style.display = 'block';
  resumenEl.innerHTML = `
    <div class="row"><span>Subtotal</span><span>${formatMoneda(promo.subtotalTotal)}</span></div>
    ${promo.aplica?`<div class="row"><span>Descuento</span><span>-${formatMoneda(promo.descuentoTotal)}</span></div>`:''}
    <div class="row total"><span>Total</span><span>${formatMoneda(promo.subtotalTotal - promo.descuentoTotal)}</span></div>`;
}

function setStatus(msg, isErr){ const el=document.getElementById('statusMsg'); el.textContent=msg; el.className='status '+(isErr?'err':'ok'); }

async function confirmarVenta(){
  if(!carrito.length){ setStatus('El carrito está vacío', true); return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; setStatus('Registrando…', false);
  try{
    const promo = calcularPromocion(carrito.map(c=>({producto_id:c.producto_id, subtotal:c.subtotal})), promoConfig);
    const grupoId = 'venta_grp_' + Date.now();
    const nuevasVentas = [];
    for(let i=0;i<carrito.length;i++){
      const c = carrito[i];
      const l = lotes.find(x => x.id === c.lote_id);
      if(c.tipo === 'caja') venderCaja(l, c.cantidad); else venderVial(l, c.cantidad);
      const totalLinea = promo.items[i].total_linea;
      const descuentoPctReal = c.subtotalLista > 0 ? Math.round((c.subtotalLista - totalLinea)/c.subtotalLista*10000)/100 : 0;
      nuevasVentas.push({
        id: 'venta_' + Date.now() + '_' + i, lote_id: c.lote_id, producto_nombre: c.producto_nombre,
        fecha: new Date().toISOString(), tipo_venta: c.tipo, cantidad: c.cantidad,
        precio_vendido: totalLinea, precio_lista: c.subtotalLista,
        con_descuento: descuentoPctReal > 0.001, descuento_pct: descuentoPctReal,
        cortesia: c.esManual && c.precioUnit === 0, nota: c.motivo || '',
        grupo_id: grupoId, vendedor_id: vendedor.id, vendedor_nombre: vendedor.nombre,
      });
    }
    await ghPut('data/lotes.json', lotes, `Venta (${vendedor.nombre}): ${carrito.length} productos`);
    let ventas; try{ ventas = await ghGetRaw('data/ventas.json'); }catch(e){ ventas = []; }
    ventas.push(...nuevasVentas);
    await ghPut('data/ventas.json', ventas, `Venta registrada por ${vendedor.nombre}`);
    setStatus(`✓ Venta registrada — ${formatMoneda(promo.subtotalTotal - promo.descuentoTotal)}`, false);
    carrito = [];
    renderForm();
  }catch(e){ setStatus('Error: ' + e.message, true); }
  finally{ btn.disabled = false; }
}

init();
</script>
</body>
</html>
