<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peptora — Editar lote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css?v=20260930">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/icon-180.png">
<link rel="manifest" href="../site.webmanifest">
<meta name="theme-color" content="#102a3a">
</head>
<body>
<div class="form-wrap">
  <a href="../" class="back">← Inicio</a>
  <a href="#" onclick="localStorage.removeItem('peptora_token'); location.reload(); return false;" class="back" style="float:right;">cambiar token</a>
  <header>
    <div class="eyebrow">PEPTORA · inventario</div>
    <h1>Editar / eliminar lote</h1>
    <p>Corrige precios, costos o stock capturado — o elimina el lote.</p>
  </header>

  <div class="token-bar" id="tokenBar">
    <input type="password" id="tokenInput" placeholder="Pega tu GitHub token (se guarda solo en este navegador)">
    <button onclick="guardarToken()">Guardar</button>
  </div>

  <div class="card">
    <div class="field">
      <label>Selecciona un lote</label>
      <select id="loteSelect" onchange="cargarLote()"><option value="">Cargando…</option></select>
    </div>
  </div>

  <div id="formEdicion"></div>
</div>

<script src="../js/datos.js?v=20260930"></script>
<script>
const REPO = 'peptoramx/Peptora';
const API = `https://api.github.com/repos/${REPO}/contents`;
let lotes = [], shaCache = {};

function getToken(){ return localStorage.getItem('peptora_token'); }
function guardarToken(){
  const t = document.getElementById('tokenInput').value.trim();
  if(!t) return;
  localStorage.setItem('peptora_token', t);
  document.getElementById('tokenBar').classList.remove('show');
  init();
}
function ensureToken(){
  if(!getToken()){ document.getElementById('tokenBar').classList.add('show'); return false; }
  return true;
}
async function ghGetRaw(path){
  const res = await fetch(`${API}/${path}`, { headers:{ 'Authorization':`Bearer ${getToken()}`, 'Accept':'application/vnd.github+json' } });
  if(!res.ok) throw new Error(`GET ${path} -> ${res.status}`);
  const json = await res.json();
  shaCache[path] = json.sha;
  const datos=JSON.parse(decodeURIComponent(escape(atob(json.content))) || '[]');
  return path==='data/lotes.json' ? datos.map(normalizarLote) : datos;
}
async function ghPut(path, dataArr, msg){
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(dataArr, null, 2))));
  const body = { message: msg, content, branch:'main' };
  if(shaCache[path]) body.sha = shaCache[path];
  const res = await fetch(`${API}/${path}`, {
    method:'PUT',
    headers:{ 'Authorization':`Bearer ${getToken()}`, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error(`PUT ${path} -> ${res.status}: ${await res.text()}`);
  const json = await res.json();
  shaCache[path] = json.content.sha;
}

async function ghPutBinario(path, base64Content, msg){
  const existing = await fetch(`${API}/${path}`, {headers:{Authorization:`Bearer ${getToken()}`,Accept:'application/vnd.github+json'},cache:'no-store'});
  if(!existing.ok && existing.status!==404) throw new Error('No se pudo comprobar la imagen existente.');
  const current=existing.ok ? await existing.json() : null;
  const body = { message: msg, content: base64Content, branch: 'main', ...(current ? {sha:current.sha} : {}) };
  const res = await fetch(`${API}/${path}`, {
    method: 'PUT',
    headers: { 'Authorization': `Bearer ${getToken()}`, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error(`PUT ${path} -> ${res.status}: ${await res.text()}`);
}
function leerArchivoBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function init(){
  if(!ensureToken()) return;
  try{
    lotes = await ghGetRaw('data/lotes.json');
    const sel = document.getElementById('loteSelect');
    sel.innerHTML = '<option value="">— seleccionar —</option>' +
      lotes.map(l => `<option value="${l.id}">${l.producto_nombre}${l.concentracion_mg?' '+l.concentracion_mg+'mg':''} · ${stockEnViales(l)} unidades · costo ${formatMoneda(l.costo_por_vial)} · ${l.fecha_caducidad||'sin caducidad'}</option>`).join('');
  }catch(e){ document.getElementById('formEdicion').innerHTML = `<div class="status err">Error: ${e.message}</div>`; }
}

function cargarLote(){
  const id = document.getElementById('loteSelect').value;
  const area = document.getElementById('formEdicion');
  if(!id){ area.innerHTML = ''; return; }
  const l = lotes.find(x => x.id === id);
  const d=l.desglose_precio_vial;
  const automatico=!!d;
  const aguaDefault=/\b(bac|water|agua)\b/i.test(normalizarBusqueda(l.producto_nombre))?0:precioAguaReferencia();
  area.innerHTML = `
    <div class="card">
      <h2>${l.producto_nombre} — ${l.lote||'s/lote'}</h2>
      <div class="row">
        <div class="field"><label>Fecha de caducidad</label><input id="e_caducidad" type="date" value="${l.fecha_caducidad||''}"></div>
        <div class="field"><label>Concentración (mg)</label><input id="e_conc" type="number" step="0.01" value="${l.concentracion_mg||0}"></div>
      </div>
      <div class="row">
        <div class="field"><label>Existencias (unidades / viales)</label><input id="e_stockvial" type="number" min="0" step="1" value="${stockEnViales(l)}" oninput="recalc()"></div>
        <div class="field"><label>Costo unitario neto</label><input id="e_costovial" type="number" min="0" step="0.0001" value="${l.costo_por_vial||0}" oninput="recalc()"></div>
      </div>
      <div class="row">
        <div class="field full"><label><input id="e_desglose" type="checkbox" ${automatico?'checked':''} onchange="activarDesglose()"> Calcular precio con desglose por vial</label><div class="hint">${automatico?'Se recuperan los importes guardados en este lote.':'Este lote no tiene desglose. Su precio actual se conserva hasta que actives el cálculo; revisa los importes antes de guardar.'}</div></div>
      </div>
      <div class="row">
        <div class="field"><label for="e_envio">Envío, etiqueta y empaque por vial</label><input id="e_envio" type="number" min="0" step="0.01" value="${d?.envio??0}" oninput="recalc()" ${automatico?'':'disabled'}></div>
        <div class="field"><label for="e_comision">Comisión fija por vial</label><input id="e_comision" type="number" min="0" step="0.01" value="${d?.comision??0}" oninput="recalc()" ${automatico?'':'disabled'}><div class="hint">Provisión para el precio; no modifica las reglas de pago del vendedor.</div></div>
      </div>
      <div class="row">
        <div class="field"><label for="e_agua">Agua BAC 3 ml por vial</label><input id="e_agua" type="number" min="0" step="0.01" value="${d?.agua_bac_3ml??aguaDefault}" oninput="recalc()" ${automatico?'':'disabled'}><div class="hint">Propone el precio de venta registrado del agua de 3 ml; editable, admite cero. No descuenta existencias de agua.</div></div>
        <div class="field"><label for="e_ganancia">Ganancia absoluta por vial</label><input id="e_ganancia" type="number" min="0" step="0.01" value="${d?.ganancia??Math.max(0,Number(l.precio_venta_vial||0)-Number(l.costo_por_vial||0)-aguaDefault)}" oninput="recalc()" ${automatico?'':'disabled'}></div>
      </div>
      <div class="row">
        <div class="field"><label>Precio de venta por unidad</label><input id="e_preciovial" type="number" min="0" step="0.01" value="${l.precio_venta_vial||0}" oninput="recalc()"></div>
        <div class="field"><label>Precio para salir tablas / descuento máximo</label><div class="computed" id="e_margen" aria-live="polite"></div><div class="hint">Costo + envío/empaque + comisión fija + agua. No contempla gastos omitidos. El descuento consume la ganancia esperada.</div></div>
      </div>
      <div class="field full">
        <label>Foto del producto${l.imagen_url ? ' (ya tiene una — sube otra para reemplazarla)' : ''}</label>
        ${l.imagen_url ? `<img src="../${l.imagen_url}" style="max-width:120px;border:1px solid var(--hairline);border-radius:var(--radius);margin-bottom:8px;">` : ''}
        <input id="e_imagenFile" type="file" accept="image/*">
      </div>
      <div class="submit-bar">
        <button class="btn" onclick="guardarCambios('${id}')">Guardar cambios</button>
        <button class="btn ghost" style="color:var(--brick);border-color:var(--brick);" onclick="eliminarLote('${id}')">Eliminar lote</button>
      </div>
      <span class="status" id="statusMsg"></span>
    </div>`;
  recalc();
}

function precioAguaReferencia(){
  const referencias=lotes.filter(l=>/\b(bac|water|agua)\b/i.test(normalizarBusqueda(l.producto_nombre))&&/3\s*ml/i.test(l.producto_nombre)&&Number(l.precio_venta_vial)>=0).sort((a,b)=>String(b.fecha_adquisicion||'').localeCompare(String(a.fecha_adquisicion||''))||String(b.id).localeCompare(String(a.id)));
  return Number(referencias[0]?.precio_venta_vial||0);
}
function desgloseEdicion(){
  const valores=['e_costovial','e_envio','e_comision','e_agua','e_ganancia'].map(id=>{const n=Number(document.getElementById(id).value);if(!Number.isFinite(n)||n<0)throw new Error('Los componentes del precio deben ser importes válidos y no negativos.');return n;});
  const total=valores.reduce((sum,n)=>sum+n,0);
  if(!Number.isFinite(total))throw new Error('El precio calculado no es válido.');
  return {costo:valores[0],envio:valores[1],comision:valores[2],agua_bac_3ml:valores[3],ganancia:valores[4],precio:Math.round((total+Number.EPSILON)*100)/100};
}
function activarDesglose(){recalc();}
function recalc(){
  const auto=document.getElementById('e_desglose').checked;
  for(const id of ['e_envio','e_comision','e_agua','e_ganancia'])document.getElementById(id).disabled=!auto;
  document.getElementById('e_preciovial').readOnly=auto;
  try{
    if(!auto){document.getElementById('e_margen').textContent='Activa y completa el desglose para calcular el precio mínimo.';return;}
    const d=desgloseEdicion();
    document.getElementById('e_preciovial').value=d.precio.toFixed(2);
    const base=d.costo+d.envio+d.comision+d.agua_bac_3ml;
    const descuento=Math.max(0,d.precio-base);
    document.getElementById('e_margen').textContent=formatMoneda(base)+' mínimo · '+formatMoneda(descuento)+' de descuento'+(d.precio>0?' ('+(descuento/d.precio*100).toFixed(1)+'%)':'');
  }catch(e){document.getElementById('e_preciovial').value='';document.getElementById('e_margen').textContent=e.message;}
}

function setStatus(msg, isErr){ const el=document.getElementById('statusMsg'); if(el){el.textContent=msg; el.className='status '+(isErr?'err':'ok');} }

async function guardarCambios(id){
  for(const field of ['e_conc','e_stockvial','e_costovial','e_preciovial']){
    const value=Number(document.getElementById(field).value);
    if(!Number.isFinite(value)||value<0){setStatus('Los valores deben ser números no negativos.',true);return;}
  }
  if(!Number.isSafeInteger(Number(document.getElementById('e_stockvial').value))){setStatus('Las unidades deben ser un número entero.',true);return;}
  try{
  const detalle=document.getElementById('e_desglose').checked?desgloseEdicion():null;
  const l = {...lotes.find(x => x.id === id)};
  const archivoImagen = document.getElementById('e_imagenFile').files[0];
  if(archivoImagen){
    const ext = archivoImagen.name.split('.').pop().toLowerCase();
    const rutaImagen = `assets/productos/${id}.${ext}`;
    const base64 = await leerArchivoBase64(archivoImagen);
    await ghPutBinario(rutaImagen, base64, `Foto de producto actualizada: ${id}`);
    l.imagen_url = rutaImagen;
  }
  Object.assign(l, {
    fecha_caducidad:document.getElementById('e_caducidad').value,
    concentracion_mg:Number(document.getElementById('e_conc').value),
    stock_cajas:0,stock_viales:Number(document.getElementById('e_stockvial').value),
    costo_por_vial:Number(document.getElementById('e_costovial').value),
    precio_venta_vial:detalle?detalle.precio:Number(document.getElementById('e_preciovial').value)
  });
  if(detalle)l.desglose_precio_vial=detalle;
  else delete l.desglose_precio_vial;
    const nuevosLotes=lotes.map(item=>item.id===id?l:item);
    await ghPut('data/lotes.json', nuevosLotes, `Editar lote: ${l.producto_nombre} ${l.lote||''}`);
    lotes=nuevosLotes;
    setStatus('✓ Cambios guardados', false);
  }catch(e){ setStatus('Error: ' + e.message, true); }
}

async function eliminarLote(id){
  const l = lotes.find(x => x.id === id);
  if(!confirm(`¿Eliminar el lote ${l.producto_nombre} · ${l.lote||'s/lote'}? Esta acción no se puede deshacer.`)) return;
  try{
    const [ventas,consignaciones]=await Promise.all([ghGetRaw('data/ventas.json'),ghGetRaw('data/consignaciones.json')]);
    if(ventas.some(v=>v.lote_id===id)||consignaciones.some(c=>c.lote_id===id)){
      setStatus('Este lote tiene ventas o consignaciones relacionadas. No se elimina para conservar el historial.',true);return;
    }
    const nuevosLotes = lotes.filter(x=>x.id!==id);
    await ghPut('data/lotes.json', nuevosLotes, `Eliminar lote: ${l.producto_nombre} ${l.lote||''}`);
    lotes=nuevosLotes;
    document.getElementById('formEdicion').innerHTML = '';
    init();
  }catch(e){ setStatus('Error: ' + e.message, true); }
}

if(ensureToken()) init();
</script>
<script src="../js/ui.js?v=20260930"></script>
</body>
</html>
