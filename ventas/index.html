<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peptora — Ventas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css?v=2">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/icon-180.png">
<link rel="manifest" href="../site.webmanifest">
<meta name="theme-color" content="#0EA99B">
<style>
  .v-row{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .v-row:last-child{border-bottom:none;}
  .v-row.head{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
  .v-row.cancelada{opacity:.5;}
  .n{font-weight:600;}
  .meta{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>
<div class="form-wrap" style="max-width:820px;">
  <a href="../" class="back">← dashboard</a>
  <header>
    <div class="eyebrow">Peptora · historial</div>
    <h1>Ventas</h1>
    <p>Cancelar restaura el stock del lote — la venta queda marcada, no se borra.</p>
  </header>

  <div class="token-bar" id="tokenBar">
    <input type="password" id="tokenInput" placeholder="Pega tu GitHub token (se guarda solo en este navegador)">
    <button onclick="guardarToken()">Guardar</button>
  </div>

  <div class="card">
    <div class="v-row head"><div>Producto</div><div>Fecha</div><div>Cantidad</div><div>Precio</div><div></div></div>
    <div id="listaVentas"></div>
  </div>
</div>

<script src="../js/datos.js?v=2"></script>
<script>
const REPO = 'peptoramx/Peptora';
const API = `https://api.github.com/repos/${REPO}/contents`;
let ventas = [], lotes = [], shaCache = {};

function getToken(){ return localStorage.getItem('peptora_token'); }
function guardarToken(){
  const t = document.getElementById('tokenInput').value.trim();
  if(!t) return;
  localStorage.setItem('peptora_token', t);
  document.getElementById('tokenBar').classList.remove('show');
  init();
}
function ensureToken(){
  if(!getToken()){ document.getElementById('tokenBar').classList.add('show'); return false; }
  return true;
}
async function ghGetRaw(path){
  const res = await fetch(`${API}/${path}`, { headers:{ 'Authorization':`Bearer ${getToken()}`, 'Accept':'application/vnd.github+json' } });
  if(!res.ok) throw new Error(`GET ${path} -> ${res.status}`);
  const json = await res.json();
  shaCache[path] = json.sha;
  return JSON.parse(decodeURIComponent(escape(atob(json.content))) || '[]');
}
async function ghPut(path, dataArr, msg){
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(dataArr, null, 2))));
  const body = { message: msg, content, branch:'main' };
  if(shaCache[path]) body.sha = shaCache[path];
  const res = await fetch(`${API}/${path}`, {
    method:'PUT',
    headers:{ 'Authorization':`Bearer ${getToken()}`, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error(`PUT ${path} -> ${res.status}: ${await res.text()}`);
  const json = await res.json();
  shaCache[path] = json.content.sha;
}

async function init(){
  if(!ensureToken()) return;
  try{
    [ventas, lotes] = await Promise.all([ghGetRaw('data/ventas.json'), ghGetRaw('data/lotes.json')]);
    render();
  }catch(e){ document.getElementById('listaVentas').innerHTML = `<div class="status err">Error: ${e.message}</div>`; }
}

function render(){
  const el = document.getElementById('listaVentas');
  const ordenadas = [...ventas].map((v,idx)=>({...v, _idx: ventas.indexOf(v)})).sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));
  if(!ordenadas.length){ el.innerHTML = '<div class="empty">Sin ventas todavía.</div>'; return; }
  el.innerHTML = ordenadas.map(v => `
    <div class="v-row ${v.cancelada?'cancelada':''}">
      <div><div class="n">${v.producto_nombre}${v.cortesia?' <span class="badge amber" style="font-size:9px;">CORTESÍA</span>':''}</div><div class="meta">${v.vendedor_nombre?'vendedor: '+v.vendedor_nombre:'venta propia'}${v.con_descuento?' · con descuento':''}</div></div>
      <div class="cell-mono">${new Date(v.fecha).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
      <div class="cell-mono">${v.cantidad} ${v.tipo_venta}</div>
      <div class="cell-mono strong">${formatMoneda(v.precio_vendido)}</div>
      <div>${v.cancelada ? '<span class="badge brick">Cancelada</span>' : `<button class="link-btn" style="color:var(--brick);" onclick="cancelarVenta(${v._idx})">Cancelar</button>`}</div>
    </div>`).join('');
}

async function cancelarVenta(idx){
  const v = ventas[idx];
  if(!confirm(`¿Cancelar esta venta de ${v.producto_nombre} (${formatMoneda(v.precio_vendido)})? Se regresará el stock.`)) return;
  const l = lotes.find(x => x.id === v.lote_id);
  try{
    if(l) revertirStock(l, v.tipo_venta, v.cantidad);
    v.cancelada = true;
    v.fecha_cancelacion = new Date().toISOString();
    if(l) await ghPut('data/lotes.json', lotes, `Cancelar venta: regresar stock ${v.producto_nombre}`);
    await ghPut('data/ventas.json', ventas, `Cancelar venta: ${v.producto_nombre}`);
    render();
  }catch(e){ alert('Error al cancelar: ' + e.message); }
}

if(ensureToken()) init();
</script>
</body>
</html>
